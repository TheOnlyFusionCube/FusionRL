[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionrl"
version = "0.1.0"
description = "Compatibility-first synthesis of agentic RL rewards, provenance, scheduling and execution-normalized optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
train = ["torch>=2.6,<3"]
data = ["pyarrow>=15", "huggingface_hub>=0.24"]

[project.scripts]
fusionrl = "fusionrl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusionrl*"]

[tool.setuptools.package-data]
"fusionrl.integrations.verl" = ["source_contract.json", "config/*.yaml"]

